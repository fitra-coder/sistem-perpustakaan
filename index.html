<!DOCTYPE html>
<html>

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
    .header { background-color: #3498db; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; margin-bottom: 20px; }
    .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: bold; color: #333; }
    .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .btn { background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 10px; }

    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }

</head>
<body>

  <div class="header">
    <h3>Sistem Perpustakaan</h3>

      <button onclick="switchView('login')" style="background:transparent; border:1px solid white; color:white; padding:5px 10px; border-radius:4px; cursor:pointer;">Login</button>

  <div class="container">
    <!-- Pendaftaran -->

        <button class="btn" id="btnReqOtp" onclick="mintaOTP()">Kirim Kode OTP</button>

        <div class="form-group"><label>Nama Lengkap</label><input type="text" id="nama" class="form-control"></div>
        <div class="form-group"><label>NIM</label><input type="text" id="nim" class="form-control"></div>

        <div class="form-group"><label>Fakultas</label><input type="text" id="fakultas" class="form-control" placeholder="Contoh: Pascasarjana"></div>

        <div class="form-group">

          <div class="camera-section">
    <!-- Elemen Video untuk menampilkan tangkapan langsung dari kamera -->

    <!-- Tombol upload manual sebagai cadangan jika kamera rusak -->
    <button type="button" class="btn" style="background-color: #7f8c8d; width:auto;" onclick="document.getElementById('fileUpload').click()">📁 Upload Biasa</button>
    <input type="file" id="fileUpload" style="display:none;" accept="image/*" onchange="previewUpload(event)">
    </div>
    </div>
        </div>

    <!-- Login -->

      <div class="nav-tabs">
        <button id="tabUser" class="active" onclick="setLoginRole('user')">Mahasiswa</button>

  <script>
    // ====================================================================
    // API BRIDGE: MENGHUBUNGKAN GITHUB KE GOOGLE APPS SCRIPT
    // (Link sudah disesuaikan otomatis dengan milik Anda)
    // ====================================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbzPrd1Z37USrDKovrz_LYTqW_yF1azGAGrXrMl2QJwg_SftVGZlo7zd2v8_sUnJUF3vIw/exec"; 

    const google = {
      script: {
        run: {
          withSuccessHandler: function(fn) { this.success = fn; return this; },
          withFailureHandler: function(fn) { this.failure = fn; return this; },
          _call: function(action, payload) {
            _call: function(action, payload) {
            fetch(API_URL, { 
              method: 'POST', 
              headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
              redirect: 'follow', 
              body: JSON.stringify({ action: action, ...payload }) 
            })
            .then(res => res.json())
            .then(data => { if(this.success) this.success(data); })
            .catch(err => { if(this.failure) this.failure(err); else alert("Gagal terhubung ke database server."); });
          },
          requestOTP: function(noHp) { this._call('requestOTP', {noHp}); },
          verifyOTP: function(otpId, otpCode) { this._call('verifyOTP', {otpId, otpCode}); },
          simpanDataAnggota: function(data) { this._call('simpanDataAnggota', {data}); },
          prosesLogin: function(role, identifier, password) { this._call('prosesLogin', {role, identifier, password}); },
          ajukanPeminjaman: function(nim, nama, judulBuku) { this._call('ajukanPeminjaman', {nim, nama, judulBuku}); },
          ajukanBebasPustaka: function(nim, nama) { this._call('ajukanBebasPustaka', {nim, nama}); },
          getAdminData: function() { this._call('getAdminData', {}); },
          updateStatus: function(sheetName, rowIndex, colIndex, status) { this._call('updateStatus', {sheetName, rowIndex, colIndex, status}); },
          cekStatusSurat: function(nim) { this._call('cekStatusSurat', {nim}); }
        }
      }
    };
    // ====================================================================
// 1. Masukkan URL Web App Apps Script Anda di sini!
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzPrd1Z37USrDKovrz_LYTqW_yF1azGAGrXrMl2QJwg_SftVGZlo7zd2v8_sUnJUF3vIw/exec";

// 2. Fungsi pembantu pengganti google.script.run
function panggilServer(action, payload = {}) {
  return fetch(URL_APPS_SCRIPT, {
    method: 'POST',
    redirect: 'follow', // Wajib agar tidak diblokir Google
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, payload: payload })
  }).then(res => res.json());
}
    let stream; let fotoData = ""; let currentOtpId = ""; let loginRole = 'user'; let currentUser = {};

    function switchView(viewName) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + viewName).classList.add('active');
    }

    function logout() {
      currentUser = {};
      document.getElementById('nav-guest').style.display = 'block'; document.getElementById('nav-user').style.display = 'none';
      document.getElementById('loginUsername').value = ''; document.getElementById('loginPassword').value = '';
      document.getElementById('areaSuratStatus').innerHTML = ''; switchView('login');
    }

    function setLoginRole(role) {
      loginRole = role;
      document.getElementById('tabUser').classList.remove('active'); document.getElementById('tabAdmin').classList.remove('active');
      if(role === 'user') { document.getElementById('tabUser').classList.add('active'); document.getElementById('lblUsername').innerText = "NIM Mahasiswa"; } 
      else { document.getElementById('tabAdmin').classList.add('active'); document.getElementById('lblUsername').innerText = "Username Admin"; }
    }

    function doLogin() {
      const id = document.getElementById('loginUsername').value;
      const pw = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnLoginMasuk');
      if(!id || !pw) return alert("Isi form login!");
      btn.innerText = "Memproses..."; btn.disabled = true;
     panggilServer("prosesLogin", { role: loginRole, id: id, pw: pw })
      .then(res => {
        btn.innerText = "Login Masuk"; btn.disabled = false;
        
        if(res.success) {
          document.getElementById('nav-guest').style.display = 'none'; document.getElementById('nav-user').style.display = 'block';
          if(res.role === 'admin') { switchView('admin'); loadAdminData(); }
          else {
            currentUser = res.data;
            document.getElementById('userNama').innerText = currentUser.nama || "-"; document.getElementById('userNim').innerText = currentUser.nim || "-"; document.getElementById('userStatus').innerText = currentUser.status || "-";
            
            if(currentUser.status === "Terverifikasi") {
              document.getElementById('areaFiturUser').style.display = "block"; document.getElementById('areaBlokirUser').style.display = "none"; document.getElementById('btnCetakKartu').style.display = "block"; cekStatusSuratUser();
            } else {
              document.getElementById('areaFiturUser').style.display = "none"; document.getElementById('areaBlokirUser').style.display = "block"; document.getElementById('btnCetakKartu').style.display = "none";
            }
            switchView('user');
          }
        } else {
          alert(res.message);
        }
      })
      .catch(err => {
        btn.innerText = "Login Masuk"; btn.disabled = false;
        alert("Terjadi kesalahan jaringan: " + err);
      });
    }
    
    function cetakKartu() {
      const { nama, nim, prodi, fakultas, foto } = currentUser; const printWindow = window.open('', '_blank');
      const html = `<html><head><title>Kartu Anggota - ${nim}</title><style>@media print { @page { size: auto; margin: 0; } body { margin: 2cm; -webkit-print-color-adjust: exact; color-adjust: exact;} } body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 50px;} .card { width: 340px; height: 210px; border: 2px solid #2980b9; border-radius: 8px; padding: 15px; background: #fff; position: relative; box-shadow: 0 4px 8px rgba(0,0,0,0.1);} .header { text-align: center; border-bottom: 2px solid #2980b9; padding-bottom: 5px; margin-bottom: 15px; } .header h3 { margin: 0; font-size: 15px; color: #2980b9; text-transform: uppercase; font-weight: bold;} .header h4 { margin: 3px 0 0 0; font-size: 12px; color: #333; } .content { display: flex; gap: 15px; align-items: flex-start; } .foto { width: 75px; height: 100px; object-fit: cover; border: 1px solid #ccc; border-radius: 4px; background: #eee; } .details table { font-size: 11px; border-collapse: collapse; } .details td { padding: 4px 0; vertical-align: top; } .footer { position: absolute; bottom: 10px; right: 15px; font-size: 10px; font-style: italic; color: #666; }</style></head><body><div class="card"><div class="header"><h3>KARTU ANGGOTA PERPUSTAKAAN</h3><h4>Universitas Lancang Kuning</h4></div><div class="content"><img src="${foto || ''}" class="foto" alt="Foto Profil"><div class="details"><table style="border:none;"><tr><td width="55"><b>Nama</b></td><td width="10">:</td><td>${nama}</td></tr><tr><td><b>NIM</b></td><td>:</td><td>${nim}</td></tr><tr><td><b>Prodi</b></td><td>:</td><td>${prodi}</td></tr><tr><td><b>Fakultas</b></td><td>:</td><td>${fakultas}</td></tr></table></div></div><div class="footer">Berlaku selama menjadi mahasiswa aktif</div></div><script>setTimeout(function() { window.print(); }, 500);<\/script></body></html>`;
      printWindow.document.write(html); printWindow.document.close();
    }

    function cekStatusSuratUser() {
      document.getElementById('areaSuratStatus').innerHTML = '<i>Mengecek berkas...</i>';
      google.script.run.withSuccessHandler(res => {
        const area = document.getElementById('areaSuratStatus');
        if(res.found) {
          if(res.status === 'Selesai / Terbit') {
            area.innerHTML = `<div style="background:#e8f8f5; border:1px solid #2ecc71; padding:15px; border-radius:4px; margin-bottom:20px;"><h4 style="color:#27ae60; margin-top:0;">Berkas Anda Tersedia</h4><p style="font-size:14px; margin-bottom:10px;">Surat Bebas Pustaka Anda telah disetujui.</p><button class="btn btn-success" style="width:100%; font-size:16px;" onclick="cetakPDF()">📄 Download / Cetak PDF Surat</button></div>`;
          } else { area.innerHTML = `<div style="background:#fff3e0; padding:10px; border-radius:4px; margin-bottom:15px; border:1px solid #ffb74d; color:#e67e22; font-size:13px;">Status Pengajuan Surat: <b>${res.status}</b></div>`; }
        } else { area.innerHTML = ''; }
      }).cekStatusSurat(currentUser.nim);
    }

    function cetakPDF() {
      const nama = currentUser.nama; const nim = currentUser.nim; const d = new Date(); const tanggal = d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear(); const printWindow = window.open('', '_blank');
      const html = `<html><head><title>Surat Bebas Pustaka - ${nim}</title><style>@media print { @page { size: A4; margin: 2cm; } } body { font-family: "Times New Roman", Times, serif; padding: 20px; line-height: 1.6; color: #000; } .kop { text-align: center; border-bottom: 3px solid black; margin-bottom: 30px; padding-bottom: 10px; } .kop h2 { margin: 0; font-size: 22px; text-transform: uppercase; } .kop h3 { margin: 5px 0; font-size: 18px; } .kop p { margin: 0; font-size: 14px; } .content { margin-top: 40px; text-align: justify; font-size: 16px; } .signature { margin-top: 80px; float: right; text-align: center; width: 250px; }</style></head><body><div class="kop"><h2>UNIVERSITAS LANCANG KUNING</h2><h3>UPT PERPUSTAKAAN</h3><p>Jl. Yos Sudarso Km. 8 Rumbai, Pekanbaru, Riau</p></div><h3 style="text-align:center; text-decoration:underline; margin-bottom:40px;">SURAT KETERANGAN BEBAS PUSTAKA</h3><div class="content"><p>Kepala UPT Perpustakaan Universitas Lancang Kuning dengan ini menerangkan bahwa:</p><table style="margin-left: 30px; margin-bottom: 20px; margin-top: 20px; font-size: 16px;"><tr><td width="180">Nama Lengkap</td><td>: <b>${nama}</b></td></tr><tr><td>NIM</td><td>: <b>${nim}</b></td></tr></table><p>Mahasiswa tersebut di atas dinyatakan <b>TIDAK MEMILIKI PINJAMAN BUKU</b> dan <b>TIDAK MEMILIKI TANGGUNGAN DENDA</b> di UPT Perpustakaan Universitas Lancang Kuning.</p><p>Demikian surat keterangan ini diberikan untuk dapat dipergunakan sebagai salah satu syarat akademik / pengambilan ijazah.</p></div><div class="signature"><p>Pekanbaru, ${tanggal}</p><p>Kepala UPT Perpustakaan,</p><br><br><br><br><p><b>( .................................................... )</b></p></div><script>setTimeout(function() { window.print(); }, 500);<\/script></body></html>`;
      printWindow.document.write(html); printWindow.document.close();
    }

    function mintaOTP() {
      let inputNoHp = document.getElementById('noHp'); let noHp = inputNoHp.value.replace(/\D/g, '');
      if (noHp.startsWith('62')) noHp = '0' + noHp.substring(2); else if (noHp.startsWith('8')) noHp = '0' + noHp;
      if (!noHp.startsWith('08') || noHp.length < 10) return alert("Format Nomor HP tidak valid!");
      inputNoHp.value = noHp;
      const btn = document.getElementById('btnReqOtp'); btn.innerText = "Mengirim..."; btn.disabled = true;
      google.script.run.withSuccessHandler(res => { btn.innerText = "Kirim Kode OTP"; btn.disabled = false; if(res.success || res.data) { alert("OTP dikirim!"); currentOtpId = res.data ? res.data.otp_id : res.otp_id; document.getElementById('otp-input-section').style.display = 'block'; } else alert("Gagal kirim OTP! Pesan: " + (res.message || "Unknown error")); }).requestOTP(noHp);
    }
    function verifikasiOTP() { const otpCode = document.getElementById('otpCode').value; if(!otpCode) return alert("Masukkan OTP"); google.script.run.withSuccessHandler(res => { if(res.success) { document.getElementById('step-1').style.display = 'none'; document.getElementById('step-2').style.display = 'block'; document.getElementById('noHpDaftar').value = document.getElementById('noHp').value; } else alert(res.message); }).verifyOTP(currentOtpId, otpCode); }
    
  let streamKamera = null;

// Fungsi untuk meminta izin dan menyalakan kamera
async function bukaKamera() {
  const video = document.getElementById('kameraVideo');
  const btnBuka = document.getElementById('btnBukaKamera');
  const btnJepret = document.getElementById('btnJepret');
  const hasilFoto = document.getElementById('hasilFoto');

  try {
    // Meminta akses kamera depan (facingMode: user)
    streamKamera = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    
    // Sambungkan stream ke elemen video
    video.srcObject = streamKamera;
    video.style.display = 'block';
    hasilFoto.style.display = 'none';
    
    // Ubah tombol
    btnBuka.style.display = 'none';
    btnJepret.style.display = 'inline-block';
  } catch (err) {
    alert("Gagal mengakses kamera: Pastikan Anda memberi izin kamera pada browser. (" + err.message + ")");
  }
}

// Fungsi untuk mengambil foto dari video yang sedang berjalan
function jepretFoto() {
  const video = document.getElementById('kameraVideo');
  const canvas = document.getElementById('kameraCanvas');
  const hasilFoto = document.getElementById('hasilFoto');
  const btnBuka = document.getElementById('btnBukaKamera');
  const btnJepret = document.getElementById('btnJepret');

  // Set ukuran canvas sama dengan resolusi video
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  
  // Gambar *frame* video ke canvas
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // Ubah gambar di canvas menjadi Base64 (Format teks) lalu simpan ke variabel fotoData
  fotoData = canvas.toDataURL('image/jpeg', 0.8); // 0.8 adalah kompresi kualitas 80%
  
  // Tampilkan hasil foto dan sembunyikan video hidup
  hasilFoto.src = fotoData;
  hasilFoto.style.display = 'block';
  video.style.display = 'none';
  
  // Kembalikan tombol
  btnJepret.style.display = 'none';
  btnBuka.style.display = 'inline-block';
  btnBuka.innerText = "📸 Ulangi Foto";

  // Matikan stream kamera agar lampu webcam di PC mati
  if (streamKamera) {
    streamKamera.getTracks().forEach(track => track.stop());
  }
}
    function previewUpload(event) { const file = event.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = e => { fotoData = e.target.result; document.getElementById('hasilFoto').src = fotoData; document.getElementById('hasilFoto').style.display = 'block'; document.getElementById('video').style.display = 'none'; document.getElementById('btnAmbilFoto').style.display = 'none'; document.getElementById('btnBukaKamera').style.display = 'inline-block'; }; reader.readAsDataURL(file); }
    function simpanPendaftaran() { const data = { noHp: document.getElementById('noHpDaftar').value, nama: document.getElementById('nama').value, nim: document.getElementById('nim').value, prodi: document.getElementById('prodi').value, fakultas: document.getElementById('fakultas').value, password: document.getElementById('password').value, foto: fotoData }; if(!data.nama || !data.nim || !data.password || !data.foto) return alert("Nama, NIM, Password dan Foto wajib diisi!"); const btn = document.getElementById('btnSimpan'); btn.innerText = "Menyimpan..."; btn.disabled = true; google.script.run.withSuccessHandler(res => { btn.innerText = "Kirim Pendaftaran"; btn.disabled = false; if(res.success) { alert(res.message); switchView('login'); } else alert(res.message); }).simpanDataAnggota(data); }
    function ajukanPinjam() { const judul = document.getElementById('judulBuku').value; if(!judul) return alert("Masukkan judul buku!"); google.script.run.withSuccessHandler(res => { alert(res.message); document.getElementById('judulBuku').value = ''; loadAdminData(); }).ajukanPeminjaman(currentUser.nim, currentUser.nama, judul); }
    function ajukanBebas() { if(!confirm("Yakin mengajukan surat Bebas Pustaka?")) return; google.script.run.withSuccessHandler(res => { alert(res.message); cekStatusSuratUser(); }).ajukanBebasPustaka(currentUser.nim, currentUser.nama); }
    function showAdminTab(tabName) { document.getElementById('adminAnggota').style.display = 'none'; document.getElementById('adminPinjam').style.display = 'none'; document.getElementById('adminSurat').style.display = 'none'; document.getElementById(tabName).style.display = 'block'; loadAdminData(); }
    function loadAdminData() { google.script.run.withSuccessHandler(res => { if(!res.success) return; let data = res; let htmlAnggota = '<tr><th>Nama</th><th>NIM</th><th>Aksi</th></tr>'; if(data.anggota.length === 0) htmlAnggota += '<tr><td colspan="3" style="text-align:center;">Kosong</td></tr>'; data.anggota.forEach(row => { htmlAnggota += `<tr><td>${row.data[2]}</td><td>${row.data[3]}</td><td><button class="btn btn-success" onclick="acc('Database Perpustakaan', ${row.rowIndex}, 7, 'Terverifikasi')">Setujui</button></td></tr>`; }); document.getElementById('tblAnggota').innerHTML = htmlAnggota; let htmlPinjam = '<tr><th>NIM</th><th>Nama</th><th>Buku</th><th>Status</th><th>Aksi</th></tr>'; if(data.pinjaman.length === 0) htmlPinjam += '<tr><td colspan="5" style="text-align:center;">Kosong</td></tr>'; data.pinjaman.forEach(row => { let btn = row.data[4] === "Menunggu Verifikasi" ? `<button class="btn btn-success" onclick="acc('Peminjaman', ${row.rowIndex}, 5, 'Dipinjam')">Izinkan</button>` : `<button class="btn btn-secondary" style="width:auto; padding:5px;" onclick="acc('Peminjaman', ${row.rowIndex}, 5, 'Dikembalikan')">Kembalikan</button>`; htmlPinjam += `<tr><td>${row.data[1]}</td><td>${row.data[2]}</td><td>${row.data[3]}</td><td>${row.data[4]}</td><td>${btn}</td></tr>`; }); document.getElementById('tblPinjam').innerHTML = htmlPinjam; let htmlSurat = '<tr><th>NIM</th><th>Nama</th><th>Aksi</th></tr>'; if(data.bebasPustaka.length === 0) htmlSurat += '<tr><td colspan="3" style="text-align:center;">Kosong</td></tr>'; data.bebasPustaka.forEach(row => { htmlSurat += `<tr><td>${row.data[1]}</td><td>${row.data[2]}</td><td><button class="btn btn-success" onclick="acc('Bebas Pustaka', ${row.rowIndex}, 4, 'Selesai / Terbit')">Terbitkan</button></td></tr>`; }); document.getElementById('tblSurat').innerHTML = htmlSurat; }).getAdminData(); }
    function acc(sheetName, rowIndex, colIndex, status) { if(!confirm("Ubah status menjadi: " + status + "?")) return; google.script.run.withSuccessHandler(res => { alert(res.message); loadAdminData(); }).updateStatus(sheetName, rowIndex, colIndex, status); }
  </script>
