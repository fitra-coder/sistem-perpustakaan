<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Perpustakaan Universitas Lancang Kuning</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
    .header { background-color: #3498db; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; margin-bottom: 20px; }
    .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: bold; color: #333; }
    .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .btn { background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 10px; }
    .btn-secondary { background-color: #7f8c8d; }
    .btn-success { background-color: #2ecc71; width: auto; padding: 5px 10px;}
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .nav-tabs button { flex: 1; padding: 10px; cursor: pointer; border: 1px solid #3498db; background: white; color: #3498db; font-weight: bold; border-radius: 4px; }
    .nav-tabs button.active { background: #3498db; color: white; }
    .camera-section { border: 1px dashed #ccc; padding: 20px; text-align: center; border-radius: 4px; margin-bottom: 15px; }
    .camera-buttons { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px;}
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
    th { background-color: #f8f9fa; }
    .view-section { display: none; }
    .view-section.active { display: block; }
  </style>
</head>
<body>

  <div class="header">
    <h3>Sistem Perpustakaan</h3>
    <div id="nav-guest">
      <button onclick="switchView('login')" style="background:transparent; border:1px solid white; color:white; padding:5px 10px; border-radius:4px; cursor:pointer;">Login</button>
      <button onclick="switchView('register')" style="background:white; border:none; color:#3498db; padding:5px 10px; border-radius:4px; cursor:pointer; font-weight:bold;">Daftar</button>
    </div>
    <div id="nav-user" style="display:none;">
      <button onclick="logout()" style="background:#e74c3c; border:none; color:white; padding:5px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">Log Out</button>
    </div>
  </div>

  <div class="container">
    <!-- Pendaftaran -->
    <div id="view-register" class="view-section">
      <h2 style="text-align: center; color: #3498db;">Pendaftaran Anggota</h2>
      <div id="step-1">
        <div class="form-group"><label>Nomor HP (WhatsApp)</label><input type="text" id="noHp" class="form-control" placeholder="08xxxx"></div>
        <button class="btn" id="btnReqOtp" onclick="mintaOTP()">Kirim Kode OTP</button>
        <div id="otp-input-section" style="display:none; margin-top: 20px;">
          <div class="form-group"><label>Masukkan OTP</label><input type="text" id="otpCode" class="form-control" placeholder="6 Digit OTP"></div>
          <button class="btn btn-secondary" onclick="verifikasiOTP()">Verifikasi OTP</button>
        </div>
      </div>
      <div id="step-2" style="display:none;">
        <div class="form-group"><label>Nomor HP Aktif</label><input type="text" id="noHpDaftar" class="form-control" readonly></div>
        <div class="form-group"><label>Nama Lengkap</label><input type="text" id="nama" class="form-control"></div>
        <div class="form-group"><label>Email Aktif</label><input type="email" id="emailDaftar" class="form-control" placeholder="Digunakan untuk OTP Login"></div>
        <div class="form-group"><label>NIM</label><input type="text" id="nim" class="form-control"></div>
        <div class="form-group"><label>Prodi</label><input type="text" id="prodi" class="form-control" placeholder="Contoh: Magister Ilmu Komputer"></div>
        <div class="form-group"><label>Fakultas</label><input type="text" id="fakultas" class="form-control" placeholder="Contoh: Pascasarjana"></div>
        <div class="form-group"><label>Password Akun</label><input type="password" id="password" class="form-control"></div>
        <div class="form-group">
          <label>Foto Selfie</label>
          <div class="camera-section">
            <video id="kameraVideo" autoplay playsinline style="width:100%; border-radius:4px; display:none;"></video>
            <canvas id="kameraCanvas" style="display:none;"></canvas>
            <img id="hasilFoto" style="display:none; width:100%; border-radius:4px; margin-bottom:10px;" />
            <div class="camera-buttons">
              <button type="button" id="btnBukaKamera" class="btn" style="background-color: #3498db; width:auto;" onclick="bukaKamera()">📸 Buka Kamera</button>
              <button type="button" id="btnJepret" class="btn" style="background-color: #2ecc71; width:auto; display:none;" onclick="jepretFoto()">⭕ Ambil Foto</button>
              <button type="button" class="btn" style="background-color: #7f8c8d; width:auto;" onclick="document.getElementById('fileUpload').click()">📁 Upload Biasa</button>
              <input type="file" id="fileUpload" style="display:none;" accept="image/*" onchange="previewUpload(event)">
            </div>
          </div>
        </div>
        <button class="btn" id="btnSimpan" onclick="simpanPendaftaran()">Kirim Pendaftaran</button>
      </div>
    </div>

    <!-- Login -->
    <div id="view-login" class="view-section active">
      <h2 style="text-align: center; color: #3498db;">Login Sistem</h2>
      
      <!-- STRUKTUR HTML INI SEMPAT TERHAPUS -->
      <div id="login-form-main">
        <div class="nav-tabs">
          <button id="tabUser" class="active" onclick="setLoginRole('user')">Mahasiswa</button>
          <button id="tabAdmin" onclick="setLoginRole('admin')">Admin</button>
        </div>
        <div class="form-group"><label id="lblUsername">NIM Mahasiswa</label><input type="text" id="loginUsername" class="form-control"></div>
        <div class="form-group"><label>Password</label><input type="password" id="loginPassword" class="form-control"></div>
        <button class="btn" id="btnLoginMasuk" onclick="doLogin()">Login Masuk</button>
      </div>

      <!-- Form OTP Email -->
      <div id="login-form-otp" style="display:none; text-align:center;">
        <h4 style="color: #27ae60;">Verifikasi Keamanan (2FA)</h4>
        <p style="font-size:14px; margin-bottom:15px;">Kode OTP Login telah dikirim ke email:<br><strong id="lblEmailTujuan"></strong></p>
        <div class="form-group"><input type="text" id="otpLoginCode" class="form-control" placeholder="Masukkan 6 Digit OTP Email"></div>
        <button class="btn btn-success
